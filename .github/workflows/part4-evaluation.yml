name: Part 4 evaluation
on:
  push:
    paths:
      - '.github/workflows/part4-evaluation.yml'
      - 'part4_evaluation.py'
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: python -m pip install scikit-learn==1.5.2 numpy==1.26.4 scipy==1.13.1
      - name: Run both entry points and before-after evaluation
        run: |
          printf '\n' | python -X utf8 main.py
          printf '\n' | python -X utf8 ml_experiments.py
          python -X utf8 part4_evaluation.py
      - name: Publish measured results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.checks.create({
              ...context.repo,
              name: 'Part 4 measured results',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Part 4 rule and ML evaluation',
                summary: fs.readFileSync('part4_measured_results.md', 'utf8'),
                text: fs.readFileSync('part4_results.json', 'utf8')
              }
            });
      - uses: actions/upload-artifact@v4
        with:
          name: part4-results
          path: |
            part4_results.json
            part4_measured_results.md
